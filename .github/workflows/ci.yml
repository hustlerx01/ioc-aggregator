name: ci
on:
  push:
  pull_request:
  schedule: [{cron: "0 3 * * *"}]   # daily feed refresh build (artifact only, nothing published)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m iocagg.cli --fetch -o out
      - uses: actions/upload-artifact@v4
        with: {name: ioc-feed, path: out/}
